name: Build Hub OS image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils p7zip-full qemu-user-static zip unzip xz-utils kpartx python3-git python3-yaml
          docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Download base Raspberry Pi OS Lite (arm64)
        run: |
          set -euo pipefail
          mkdir -p src/image-raspberrypiarm64
          BASEDIR=$(curl -fsSL https://downloads.raspberrypi.org/raspios_lite_arm64/images/ \
            | grep -oE 'raspios_lite_arm64-[0-9-]+' | sort -u | tail -1)
          FILE=$(curl -fsSL "https://downloads.raspberrypi.org/raspios_lite_arm64/images/$BASEDIR/" \
            | grep -oE '[0-9-]+-raspios-[a-z]+-arm64-lite\.img\.xz' | head -1)
          echo "Base image: $BASEDIR/$FILE"
          curl -fL --retry 3 -o "src/image-raspberrypiarm64/$FILE" \
            "https://downloads.raspberrypi.org/raspios_lite_arm64/images/$BASEDIR/$FILE"
          ls -la src/image-raspberrypiarm64/

      - name: Build image
        run: sudo bash ./build.sh

      - name: Package image (rename + compress + checksum)
        run: |
          set -euo pipefail
          VER=$(bash -c 'source src/config; echo $DIST_VERSION')
          IMG=$(sudo find src/workspace -maxdepth 1 -name '*.img' | head -1)
          test -n "$IMG" || { echo "no .img produced"; exit 1; }
          OUT="src/workspace/HubOS-${VER}-arm64.img"
          sudo mv "$IMG" "$OUT"
          echo "built: $OUT"
          sudo xz -T0 -9 "$OUT"
          sudo sha256sum "${OUT}.xz" | sudo tee "${OUT}.xz.sha256"
          sudo chown "$(id -u):$(id -g)" "${OUT}.xz" "${OUT}.xz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hub-os-image
          path: |
            **/*.img.xz
            **/*.img.xz.sha256

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.img.xz
            **/*.img.xz.sha256
