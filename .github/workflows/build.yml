name: Build Hub OS image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable arm binfmt (chroot for arm64)
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build image
        run: sudo bash ./build.sh

      - name: Compress + checksum
        id: artifact
        run: |
          IMG="$(find . -maxdepth 4 -name '*.img' | head -1)"
          xz -T0 -9 "$IMG"
          sha256sum "${IMG}.xz" > "${IMG}.xz.sha256"
          echo "path=${IMG}.xz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hub-os-image
          path: |
            **/*.img.xz
            **/*.img.xz.sha256

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.img.xz
            **/*.img.xz.sha256
