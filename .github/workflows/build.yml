name: Build Hub OS image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils p7zip-full qemu-user-static zip unzip xz-utils kpartx
          docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Build image
        run: sudo bash ./build.sh

      - name: Compress + checksum
        run: |
          IMG=$(find . -path ./src/CustomPiOS -prune -o -name '*.img' -print | head -1)
          test -n "$IMG" || { echo "no .img produced"; exit 1; }
          sudo xz -T0 -9 "$IMG"
          sha256sum "${IMG}.xz" | tee "${IMG}.xz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: hub-os-image
          path: |
            **/*.img.xz
            **/*.img.xz.sha256

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.img.xz
            **/*.img.xz.sha256
