name: Build Hub OS image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils p7zip-full qemu-user-static zip unzip xz-utils kpartx python3-git python3-yaml
          docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Download base Raspberry Pi OS Lite (arm64)
        run: |
          set -euo pipefail
          mkdir -p src/image-raspberrypiarm64
          BASEDIR=$(curl -fsSL https://downloads.raspberrypi.org/raspios_lite_arm64/images/ \
            | grep -oE 'raspios_lite_arm64-[0-9-]+' | sort -u | tail -1)
          FILE=$(curl -fsSL "https://downloads.raspberrypi.org/raspios_lite_arm64/images/$BASEDIR/" \
            | grep -oE '[0-9-]+-raspios-[a-z]+-arm64-lite\.img\.xz' | head -1)
          echo "Base image: $BASEDIR/$FILE"
          curl -fL --retry 3 -o "src/image-raspberrypiarm64/$FILE" \
            "https://downloads.raspberrypi.org/raspios_lite_arm64/images/$BASEDIR/$FILE"
          ls -la src/image-raspberrypiarm64/

      - name: Build image
        run: sudo bash ./build.sh

      - name: Package image + Imager manifest
        run: |
          set -euo pipefail
          IMG=$(sudo find src/workspace -maxdepth 1 -name '*.img' | head -1)
          test -n "$IMG" || { echo "no .img produced"; exit 1; }
          OUT="src/workspace/HubOS-arm64.img"
          sudo mv "$IMG" "$OUT"
          EXTRACT_SHA=$(sudo sha256sum "$OUT" | awk '{print $1}')
          EXTRACT_SIZE=$(sudo stat -c %s "$OUT")
          echo "built: $OUT ($EXTRACT_SIZE bytes)"
          sudo xz -T0 -9 "$OUT"
          DL_SHA=$(sudo sha256sum "${OUT}.xz" | awk '{print $1}')
          DL_SIZE=$(sudo stat -c %s "${OUT}.xz")
          mkdir -p dist
          sudo mv "${OUT}.xz" dist/
          sudo chown -R "$(id -u):$(id -g)" dist
          echo "$DL_SHA  HubOS-arm64.img.xz" > dist/HubOS-arm64.img.xz.sha256
          python3 scripts/gen-oslist.py "$EXTRACT_SHA" "$EXTRACT_SIZE" "$DL_SHA" "$DL_SIZE" > dist/os-list.json
          echo "=== dist ==="; ls -la dist/; echo "=== os-list.json ==="; cat dist/os-list.json
      - uses: actions/upload-artifact@v4
        with:
          name: hub-os-image
          path: dist/

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
